upstream nova_backends {
    server 10.7.19.171:3001;
    server 10.7.20.75:3002;
}

server {
    listen 8080;
    server_name app.nova.test;

    location / {
        proxy_pass http://nova_backends;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name app.nova.test;

    ssl_certificate /opt/homebrew/etc/nginx/certs/app.nova.test.pem;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.nova.test-key.pem;

    location / {
        proxy_pass http://nova_backends;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

