# Phase 2 edge config for Mac 2 (Extension D). Differences from nova.phase1-baseline.conf:
#  - max_fails=1 fail_timeout=10s written out (these are nginx defaults: documents the policy, no behaviour change)
#  - proxy_connect_timeout 2s  (default 60s): fast failover when a backend is silently unreachable (T3)
#  - proxy_read_timeout 5s     (default 60s): fast failover when a backend accepts but never answers (T2)
#  - proxy_next_upstream error timeout (default, written out): retry the request on the other backend
#  - X-Edge header: shows which edge answered, also on 502 (always)
upstream nova_backends {
    server 10.7.1.218:3001 max_fails=1 fail_timeout=10s;
    server 10.7.27.160:3002 max_fails=1 fail_timeout=10s;
}

server {
    listen 8080;
    server_name app.nova.test;
    add_header X-Edge "mac2" always;

    location / {
        proxy_pass http://nova_backends;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.nova.test;

    ssl_certificate /opt/homebrew/etc/nginx/certs/app.nova.test.pem;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.nova.test-key.pem;
    add_header X-Edge "mac2" always;

    location / {
        proxy_pass http://nova_backends;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
