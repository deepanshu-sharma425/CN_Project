# Phase 1 baseline as installed on Mac 2 after S1 (23 Nov 2026):
# original nginx/nova.conf + current upstream IPs (CP1) + http2 on (S1).
# Used as the "Phase 1" side of the T2/T3 timing comparisons. nginx/nova.conf stays as the historical Phase 1 file.
upstream nova_backends {
    server 10.7.1.218:3001;
    server 10.7.27.160:3002;
}

server {
    listen 8080;
    server_name app.nova.test;

    location / {
        proxy_pass http://nova_backends;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.nova.test;

    ssl_certificate /opt/homebrew/etc/nginx/certs/app.nova.test.pem;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.nova.test-key.pem;

    location / {
        proxy_pass http://nova_backends;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
